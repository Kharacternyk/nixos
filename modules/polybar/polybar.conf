[bar/primary]
background = #00000000
bottom = true
enable-ipc = true
font-0 = monospace
font-1 = Font Awesome 6 Free Regular
font-2 = Font Awesome 6 Free Solid
modules-center = xworkspaces
modules-left = logintime
modules-right = date
padding = 1
wm-restack = bspwm

[bar/secondary]
inherit = bar/primary
modules-left = network
modules-right = memory
monitor = HDMI-1

[bar/tertiary]
inherit = bar/primary
modules-left = klunok-queue
modules-right = klunok-time
monitor = HDMI-2

[module/logintime]
hook-0 = last $USER tty7 -Rn 1 | head -n 1 | tr -s ' ' | cut -f 6 -d ' '
initial = 1
type = custom/ipc

[module/xworkspaces]
label-active = 
label-empty = 
label-monitor = ""
label-occupied = 
label-urgent = 
pin-workspaces = true
type = internal/xworkspaces

[module/date]
label = %time%
time = %H:%M
type = internal/date

[module/network]
format-packetloss = <label-packetloss>
interface-type = wireless
label-connected = %essid%
label-packetloss = %essid%
ping-interval = 5
type = internal/network

[module/memory]
type = internal/memory

[module/klunok-time]
exec = tail -f -n1 /klunok/var/journal | stdbuf -oL cut -f 1
tail = true
type = custom/script

[module/klunok-queue]
exec = ls /klunok/var/queue | while IFS= read -r line; do realpath "/klunok/var/queue/$line"; done | sort -u | while IFS= read -r line; do printf ''; done; echo
interval = 1
type = custom/script
